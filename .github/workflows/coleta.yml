name: Coleta Automática de Estoque Big Mais

on:
  schedule:
    # 1. Disparo de abertura às 04:59 da manhã (Horário de Brasília: UTC-3 -> 07:59 UTC)
    - cron: '59 7 * * *'
    # 2. Execuções a cada 30 minutos das 05:00 às 22:00 BRT (08:00 às 01:00 UTC)
    # Após as 22:00 BRT (01:00 UTC), nenhuma execução roda até as 04:59 AM
    - cron: '0,30 0,1,8-23 * * *'
  workflow_dispatch: # Permite disparar manualmente pelo botão "Run workflow"

jobs:
  executar-coleta:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permite comitar o banco atualizado de volta no repositório

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Script de Coleta
        env:
          SISTEMA_LOGIN: ${{ secrets.SISTEMA_LOGIN }}
          SISTEMA_SENHA: ${{ secrets.SISTEMA_SENHA }}
        run: |
          python main.py

      - name: Salvar Banco Atualizado no Repositório
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 1. Preserva o banco SQLite e o JSON gerados durante a coleta
          cp estoque_bigmais.db /tmp/estoque_bigmais.db
          cp estoque_bigmais.json /tmp/estoque_bigmais.json
          
          # 2. Sincroniza com as alterações remotas mais recentes ocorridas durante os ~45m de execução
          git fetch origin main
          git reset --hard origin/main
          
          # 3. Restaura os arquivos atualizados para comitar na ponta do branch
          mv /tmp/estoque_bigmais.db estoque_bigmais.db
          mv /tmp/estoque_bigmais.json estoque_bigmais.json
          
          git add estoque_bigmais.db estoque_bigmais.json
          if ! git diff --staged --quiet; then
            git commit -m "Auto: atualização de estoque e indicadores [skip ci]"
            for i in 1 2 3 4 5; do
              echo "Tentativa $i de push..."
              git push origin main && echo "Push concluído com sucesso!" && break || {
                echo "Conflito transitório de push. Sincronizando novamente..."
                cp estoque_bigmais.db /tmp/estoque_bigmais.db
                cp estoque_bigmais.json /tmp/estoque_bigmais.json
                git fetch origin main
                git reset --hard origin/main
                mv /tmp/estoque_bigmais.db estoque_bigmais.db
                mv /tmp/estoque_bigmais.json estoque_bigmais.json
                git add estoque_bigmais.db estoque_bigmais.json
                git commit -m "Auto: atualização de estoque e indicadores [skip ci]" || true
                sleep 5
              }
            done
          else
            echo "Nenhuma alteração detectada no banco ou JSON de estoque."
          fi
